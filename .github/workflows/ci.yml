name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap and fast: formatting, the catalog consistency check, and proof that every
  # configuration still evaluates. This is what catches most breakage.
  #
  # Runs on both architectures. The aarch64 half is not decoration — the Raspberry Pi is a
  # first-class target, so the CLI and the nspawn image get built and evaluated natively
  # rather than only cross-checked.
  check:
    name: Evaluate and lint (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Formatting
        run: nix build .#checks.${{ matrix.system }}.formatting --print-build-logs

      - name: Catalog consistency
        run: nix build .#checks.${{ matrix.system }}.catalog-consistency --print-build-logs

      - name: The health gate fails when it should
        run: nix build .#checks.${{ matrix.system }}.health-check --print-build-logs

      - name: The CLI builds
        run: nix build .#packages.${{ matrix.system }}.lani-cli --print-build-logs

      - name: Every configuration evaluates
        run: |
          nix eval .#nixosConfigurations.lani-vm.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.lani-shell-image.config.system.build.tarball.drvPath

      - name: The catalog stands alone as a flake
        run: nix flake check ./catalog --print-build-logs

      - name: A clean checkout still builds a host from the template
        # Uses the local checkout rather than the published flake, so a pull request tests
        # itself.
        run: |
          tmp="$(mktemp -d)"
          cp -r templates/host/. "$tmp/"
          cd "$tmp"
          # No hardware-configuration.nix on a runner, so stub what a real machine would
          # have generated and check that everything else evaluates.
          cat > hardware-configuration.nix <<'EOF'
          { ... }: {
            boot.loader.grub.enable = false;
            fileSystems."/" = { device = "none"; fsType = "tmpfs"; };
          }
          EOF
          git init -q . && git add -A
          # No lock file is written: --override-input points at a working tree, and nix
          # refuses to lock against one. Evaluating is the point here anyway.
          nix eval --override-input lani "$GITHUB_WORKSPACE" \
            .#nixosConfigurations.myhost.config.system.build.toplevel.drvPath

  # The VM tests boot real machines, so they need KVM and they are slow. Kept separate so a
  # formatting mistake does not cost half an hour before anyone finds out.
  #
  # x86_64 only, because GitHub's hosted aarch64 runners have no /dev/kvm — there is no
  # nested virtualisation on them at all. `nix flake check` does define these for aarch64;
  # run them on your own hardware, or a self-hosted arm runner, if you want that coverage.
  vm-tests:
    name: NixOS VM tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        # The runners have nested virtualisation but do not grant access to /dev/kvm by
        # default. Without it the tests fall back to emulation and time out, so fail loudly
        # rather than spending an hour finding out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable; the VM tests cannot run here"; exit 1; }

      - name: Free up disk space
        # Nextcloud plus two NixOS systems does not fit alongside the runner's preinstalled
        # toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Workbench boots, and is not exposed
        run: nix build .#checks.x86_64-linux.shell-boots --print-build-logs

      - name: Services come up behind the proxy
        run: nix build .#checks.x86_64-linux.services-health --print-build-logs
