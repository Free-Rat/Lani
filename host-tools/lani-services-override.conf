# Drop-in for systemd-nspawn@lani-services.service on a non-NixOS target host.
# Deploy to: /etc/systemd/system/systemd-nspawn@lani-services.service.d/override.conf

[Unit]
# Wait for the host state dir (admin pass + nextcloud data binds) to be present.
RequiresMountsFor=/var/lib/lani

[Service]
# Force the cgroup v2 (unified) hierarchy — same NixOS+nspawn gotcha as lani-shell: nspawn
# detects the payload's systemd via /usr/lib/systemd/systemd (absent on NixOS) and otherwise
# falls back to a legacy layout the container's systemd refuses.
Environment=SYSTEMD_NSPAWN_UNIFIED_HIERARCHY=1

# Rebuild ExecStart WITHOUT "-U" (private users) so bind-mounted host dirs keep host UIDs,
# but KEEP veth/bridge networking (provided by [Network] in lani-services.nspawn via --settings=override).
ExecStart=
ExecStart=systemd-nspawn --quiet --keep-unit --boot --link-journal=try-guest --settings=override --machine=lani-services
