# Drop-in for systemd-nspawn@lani-shell.service on a non-NixOS target host.
# Deploy to: /etc/systemd/system/systemd-nspawn@lani-shell.service.d/override.conf

[Unit]
# The container's home is the LUKS volume unsealed by lani-home.service. Gate the
# container on it: it won't start unless the home is unsealed, and stopping/sealing the
# home stops the container (BindsTo).
Requires=lani-home.service
After=lani-home.service
BindsTo=lani-home.service
# If any bind mount in lani-shell.nspawn comes from a network filesystem, list it here so
# the container waits for the mount instead of starting on top of an empty directory.
# RequiresMountsFor=/srv

[Service]
# Force the cgroup v2 (unified) hierarchy for the payload. systemd-nspawn detects the
# container's systemd version via /usr/lib/systemd/systemd, which does NOT exist on a
# NixOS image (systemd lives in /nix/store), so it falls back to a legacy cgroup layout
# that the container's modern systemd refuses ("Detected unsupported legacy cgroup
# hierarchy, refusing execution"). Forcing unified fixes that.
Environment=SYSTEMD_NSPAWN_UNIFIED_HIERARCHY=1

# Drop the template's "-U" (private users) and "--network-veth":
#  - no userns  -> container root is host root, so bind-mounted directories keep host
#                  uids and a file written inside is owned by the same account outside.
#  - no veth    -> share the host network namespace (matches VirtualEthernet=no); the
#                  container's sshd on 2222 is reachable on the host's addresses.
ExecStart=
ExecStart=systemd-nspawn --quiet --keep-unit --boot --link-journal=try-guest --settings=override --machine=lani-shell
